<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 313.12 313.12">
  <defs>
    <style>
      .cls-1{fill:#ffffff;}
      .cls-2{fill:#c9924e;}

      /* Outer contours animation */
      @keyframes slideOutLeft {
        0% {
          transform: translateX(30px);
          opacity: 0;
        }
        36% {
          transform: translateX(0);
          opacity: 1;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes slideOutRight {
        0% {
          transform: translateX(-30px);
          opacity: 0;
        }
        36% {
          transform: translateX(0);
          opacity: 1;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      /* Inner symbols animation */
      @keyframes separateLeft {
        0% {
          transform: translateX(40px);
          opacity: 0;
        }
        36% {
          transform: translateX(40px);
          opacity: 0;
        }
        68% {
          transform: translateX(0);
          opacity: 1;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes separateRight {
        0% {
          transform: translateX(-40px);
          opacity: 0;
        }
        36% {
          transform: translateX(-40px);
          opacity: 0;
        }
        68% {
          transform: translateX(0);
          opacity: 1;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .outer-contours-left {
        animation: slideOutLeft 1.4s cubic-bezier(0.22, 0.61, 0.35, 1) 1s forwards;
        transform-origin: 156.56px 156.56px;
      }

      .outer-contours-right {
        animation: slideOutRight 1.4s cubic-bezier(0.22, 0.61, 0.35, 1) 1s forwards;
        transform-origin: 156.56px 156.56px;
      }

      .inner-symbols-left {
        animation: separateLeft 1.4s cubic-bezier(0.22, 0.61, 0.35, 1) 1s forwards;
        opacity: 0;
        transform-origin: 156.56px 156.56px;
      }

      .inner-symbols-right {
        animation: separateRight 1.4s cubic-bezier(0.22, 0.61, 0.35, 1) 1s forwards;
        opacity: 0;
        transform-origin: 156.56px 156.56px;
      }

      @media (prefers-reduced-motion: reduce) {
        .outer-contours-left,
        .outer-contours-right,
        .inner-symbols-left,
        .inner-symbols-right {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Outer contours left -->
  <g class="outer-contours-left">
    <rect class="cls-1" x="-2.32" y="78.42" width="165.9" height="4.4" transform="translate(-33.39 80.62) rotate(-45)"/>
    <rect class="cls-1" x="149.54" y="230.31" width="165.9" height="4.4" transform="translate(-96.31 232.5) rotate(-45)"/>
    <rect class="cls-1" x="6" y="85.64" width="165.9" height="6.6" transform="translate(-36.84 88.94) rotate(-45)"/>
    <rect class="cls-1" x="141.2" y="220.86" width="165.9" height="6.6" transform="translate(-92.86 224.15) rotate(-45)"/>
    <rect class="cls-2" x="3.81" y="147.36" width="18.4" height="18.4" transform="translate(-106.9 55.05) rotate(-45)"/>
    <rect class="cls-2" x="147.36" y="290.91" width="18.4" height="18.4" transform="translate(-166.37 198.63) rotate(-45)"/>
  </g>

  <!-- Outer contours right -->
  <g class="outer-contours-right">
    <rect class="cls-1" x="230.31" y="-2.33" width="4.4" height="165.9" transform="translate(11.1 188.02) rotate(-45)"/>
    <rect class="cls-1" x="78.41" y="149.55" width="4.4" height="165.93" transform="translate(-140.8 125.1) rotate(-45)"/>
    <rect class="cls-1" x="220.87" y="6.01" width="6.6" height="165.9" transform="translate(2.75 184.57) rotate(-45)"/>
    <rect class="cls-1" x="85.66" y="141.21" width="6.6" height="165.93" transform="translate(-132.46 128.56) rotate(-45)"/>
    <rect class="cls-2" x="147.36" y="3.81" width="18.4" height="18.4" transform="translate(36.66 114.51) rotate(-45)"/>
    <rect class="cls-2" x="290.91" y="147.36" width="18.4" height="18.4" transform="translate(-22.8 258.07) rotate(-45)"/>
  </g>

  <!-- Inner symbols left -->
  <g class="inner-symbols-left">
    <polygon class="cls-2" points="123.56 125.37 123.51 183.25 94.3 154.67 123.56 125.37"/>
    <polygon class="cls-1" points="149.59 237.17 134.18 237.17 134.18 100.72 80.23 154.67 96.71 171.15 85.81 182.05 58.43 154.67 149.59 63.51 149.59 237.17"/>
  </g>

  <!-- Inner symbols right -->
  <g class="inner-symbols-right">
    <polygon class="cls-2" points="189.56 187.75 189.61 129.87 218.82 158.45 189.56 187.75"/>
    <polygon class="cls-1" points="163.53 249.61 163.53 75.95 178.94 75.95 178.94 212.41 232.9 158.45 216.41 141.97 227.31 131.07 254.69 158.45 163.53 249.61"/>
  </g>
</svg>