<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IZLI Home</title>
  </head>
  <body>
    <main>
      <section class="home-hero">
        <div class="hero-background"></div>
        <div class="hero-content">
          <div class="hero-copy">
            <p class="hero-kicker">ROOTED IN HERITAGE. MADE FOR TODAY.</p>
            <h1>WEAR<br />YOUR<br />MEMORY</h1>
            <p class="hero-description">Heritage.<br />Transmission.<br />Freedom. Community.</p>
            <div class="hero-actions">
              <button type="button">Explore the Collection</button>
              <button type="button">Discover Our World</button>
            </div>
          </div>

          <div class="hero-model-stage"></div>

          <aside class="release-card">
            <div class="release-card__label">Current Release</div>
            <div class="release-card__title">Release 001</div>
            <div class="release-card__subtitle">Rbor Heavy Tee<br />Sand Beige</div>
            <div class="release-card__price">79 TND</div>
            <ul class="release-card__list">
              <li>100 Points</li>
              <li>Release 001 Badge</li>
              <li>Keeper Circle Event #1</li>
            </ul>
            <div class="release-card__stock">
              <span>Limited Stock</span>
              <span>120 / 300</span>
            </div>
            <button type="button" class="release-card__button">Shop Release 001</button>
          </aside>
        </div>
      </section>

      <section class="home-section home-universes"></section>
      <section class="home-section home-featured"></section>
      <section class="home-section home-stories"></section>
      <section class="home-section home-community"></section>
      <section class="home-section home-newsletter"></section>
    </main>
  </body>
</html>
