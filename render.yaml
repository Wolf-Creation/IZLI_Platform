services:
  - type: web
    name: izli-api
    runtime: node
    rootDir: src/apps/api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URLS
        value: https://www.izli.tn
      - key: QR_BASE_URL
        value: https://www.izli.tn/p/

  - type: static
    name: izli-website
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:website
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
        
  - type: static
    name: izli-admin
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:admin
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
