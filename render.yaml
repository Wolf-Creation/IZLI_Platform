services:
  - type: web
    name: izli-api
    runtime: node
    rootDir: src/apps/api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URLS
        value: https://izli.tn,https://www.izli.tn,https://admin.izli.tn,https://www.admin.izli.tn,http://localhost:8443,http://localhost:8444,http://192.168.1.132:8443,http://192.168.1.132:8444
      - key: QR_BASE_URL
        value: https://www.izli.tn/p/

  - type: static
    name: izli-website
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:website
    staticPublishPath: ./dist
    domains:
      - izli.tn
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://izli-platform.onrender.com/api
        
  - type: static
    name: izli-admin
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:admin
    staticPublishPath: ./dist
    domains:
      - admin.izli.tn
    routes:
      - type: redirect
        source: /
        destination: /admin
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://izli-platform.onrender.com/api
